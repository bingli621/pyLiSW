[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyLiSW"
version = "0.1.0"
description = "Modeling and simulation of single-crystal spin wave data from inelastic neutron scattering experiments, based on linear spin wave theory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bing Li", email = "bing.li@ess.eu" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "periodictable>=1.7",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/bingli621/pyLiSW"

[tool.hatch.build.targets.wheel]
packages = ["src/pyLiSW"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# ---------------------------------------------------------------------------
# pixi
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = ">=2"
scipy = ">=1.14"
matplotlib-base = ">=3.9"
sympy = ">=1.13"
periodictable = ">=1.7"
tabulate = ">=0.9"

[tool.pixi.pypi-dependencies]
pyLiSW = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest"
lint = "ruff check src tests"
format = "ruff format src tests"

[tool.pixi.tasks]
tutorial = { cmd = "python tutorials/{{ name }}.py", args = ["name"] }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
